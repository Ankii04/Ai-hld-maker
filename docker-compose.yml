version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: archmind-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - archmind-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archmind-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/archmind
      - FRONTEND_URL=http://localhost:5173,http://localhost:80
      - JWT_SECRET=archmind-production-jwt-secret-docker-deployment-2026
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - archmind-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: archmind-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - archmind-network

networks:
  archmind-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
